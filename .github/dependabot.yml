# Updates of the dependencies and of the pinned actions of the CI, as pull requests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types of the oldest supported VS Code (engines.vscode): newer ones offer APIs that 1.90 lacks, and vsce
      # refuses to package with them. They move by hand, together with engines.vscode.
      - dependency-name: '@types/vscode'
      # The types of the tools' Node (engines.node, .nvmrc: 22), which vitest needs as a peer; the extension itself runs
      # on the Node of VS Code (20 in 1.90), so newer majors only offer APIs it lacks. Minor and patch updates only.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A new major of TypeScript waits until typescript-eslint supports it; 7.0 does not even install with it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The release job downloads what the build uploaded: both actions move together.
      artifact-actions:
        patterns: ['actions/upload-artifact', 'actions/download-artifact']
